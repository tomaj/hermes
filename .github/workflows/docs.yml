name: Deploy Documentation

on:
  workflow_run:
    workflows: ["CI", "PHPUnit"]
    types:
      - completed
    branches:
      - master
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'pages' || format('docs-checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  links:
    name: Docs links and SVG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SVG files are well-formed XML
        run: python3 docs/scripts/check-svg.py

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Check links on the built site
        run: bash scripts/check-links.sh
        working-directory: docs

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'

    steps:
      - name: Checkout code
        # workflow_run runs from the default branch. Do not check out
        # workflow_run.head_sha: Scorecard treats that as an untrusted checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build current documentation (master)
        run: |
          echo "Building current documentation from master branch..."
          npm run docs:build
          mkdir -p ../dist
          cp -r .vitepress/dist/* ../dist/
        working-directory: docs

      - name: Download coverage report from PHPUnit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Add coverage to dist
        run: |
          if [ ! -d coverage ]; then
            echo "No coverage report found"
            exit 1
          fi
          echo "Adding coverage report to dist/coverage/"
          mkdir -p dist/coverage
          cp -r coverage/* dist/coverage/
          {
            echo "# Code Coverage Report"
            echo
            echo "Open [index.html](./index.html) for the line-by-line report."
            echo
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "- Workflow run: ${{ github.event.workflow_run.html_url }}"
          } > dist/coverage/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'master'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
