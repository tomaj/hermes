name: Bug report
description: Report a defect or unexpected behaviour in Hermes
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a security vulnerability, do not continue. Report it privately at https://github.com/tomaj/hermes/security/advisories/new (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: The worker stops after the first message when...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone else trigger this?
      placeholder: |
        1. Configure the Redis driver with...
        2. Emit a message with priority...
        3. Start the dispatcher...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exception message if there is one.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code sample
      description: The smallest snippet that shows the problem. Remove secrets and personal data.
      render: php
      placeholder: |
        $driver = new RedisSetDriver($redis);
        $emitter = new Emitter($driver);
        $emitter->emit(new Message('event', ['id' => 1]));
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Hermes version
      description: The version from composer, for example 5.0.0.
      placeholder: "5.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`.
      placeholder: "8.3"
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: Queue driver
      description: Which driver is involved?
      options:
        - Redis (phpredis)
        - Redis (Predis)
        - RabbitMQ
        - Amazon SQS
        - Custom driver
        - Not driver-specific
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, configuration (with secrets removed), or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
