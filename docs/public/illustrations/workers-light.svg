<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img">
  <title>Several Hermes workers sharing one queue</title>
  <rect width="860" height="480" rx="28" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    
    <path d="M248 240 H360 V96 H500" fill="none" stroke="#c7d2fe" stroke-width="3"/>
    <path d="M488 96 l12 8-12 8z" fill="#4f46e5"/>
    <rect x="500" y="40" width="300" height="120" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="524" y="76" fill="#475569" font-size="14">worker 1</text>
    <text x="524" y="106" fill="#0f172a" font-size="18" font-weight="700">php worker.php</text>
    <rect x="524" y="120" width="120" height="24" rx="8" fill="#eef2ff"/>
    <text x="536" y="137" fill="#4f46e5" font-size="13">one SPOP</text>

    <path d="M248 240 H500" fill="none" stroke="#c7d2fe" stroke-width="3"/>
    <path d="M488 236 l12 8-12 8z" fill="#4f46e5"/>
    <rect x="500" y="180" width="300" height="120" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="524" y="216" fill="#475569" font-size="14">worker 2</text>
    <text x="524" y="246" fill="#0f172a" font-size="18" font-weight="700">php worker.php</text>
    <rect x="524" y="260" width="120" height="24" rx="8" fill="#eef2ff"/>
    <text x="536" y="277" fill="#4f46e5" font-size="13">one SPOP</text>

    <path d="M248 240 H360 V376 H500" fill="none" stroke="#c7d2fe" stroke-width="3"/>
    <path d="M488 376 l12 8-12 8z" fill="#4f46e5"/>
    <rect x="500" y="320" width="300" height="120" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="524" y="356" fill="#475569" font-size="14">worker 3</text>
    <text x="524" y="386" fill="#0f172a" font-size="18" font-weight="700">php worker.php</text>
    <rect x="524" y="400" width="120" height="24" rx="8" fill="#eef2ff"/>
    <text x="536" y="417" fill="#4f46e5" font-size="13">one SPOP</text>

    <rect x="48" y="150" width="200" height="180" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="72" y="190" fill="#475569" font-size="15">Redis set</text>
    <text x="72" y="226" fill="#0f172a" font-size="22" font-weight="700">hermes</text>
    <rect x="72" y="246" width="150" height="26" rx="8" fill="#eef2ff"/>
    <rect x="72" y="280" width="120" height="26" rx="8" fill="#eef2ff"/>
    <text x="86" y="264" fill="#4f46e5" font-size="13">message A</text>
    <text x="86" y="298" fill="#0891b2" font-size="13">message B</text>
  </g>
</svg>
